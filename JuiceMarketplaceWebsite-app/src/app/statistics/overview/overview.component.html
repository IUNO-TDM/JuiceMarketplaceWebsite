<div class="overview"  fxLayout="column" fxLayoutGap="10px" >
    <div fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="10px" >

        <mat-card fxFlex.gt-md="34" class="iuno-card ">
            <mat-card-header>
                <mat-card-title>
                    <span class="card-title" i18n>Beliebte Getränkezutaten</span>
                </mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <google-chart *ngIf="componentreports && componentreports.length > 0; else no_top_components" [data]="topComponentsData"></google-chart>
                <ng-template #no_top_components><p class="nodata" i18n>Keine Daten vorhanden</p></ng-template>
            </mat-card-content>
        </mat-card>

        <mat-card fxFlex.gt-md="33" class="iuno-card ">
            <mat-card-header>
                <mat-card-title>
                    <span class="card-title" i18n>Dauerrenner unter den Getränken</span>
                </mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <google-chart *ngIf="allTimeTopRecipes && allTimeTopRecipes.length > 0; else no_all_time_top_recipes" [data]="allTimeTopRecipesData"></google-chart>
                <ng-template #no_all_time_top_recipes><p class="nodata" i18n>Keine Daten vorhanden</p></ng-template>
            </mat-card-content>
        </mat-card>
        <mat-card fxFlex.gt-md="33" class="iuno-card ">
            <mat-card-header>
                <mat-card-title>
                    <span class="card-title" i18n>Aktuell beliebte Rezepte</span>
                </mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <google-chart  *ngIf="todayTopRecipes && todayTopRecipes.length > 0; else no_today_top_recipes" [data]="todayTopRecipesData"></google-chart>
                <ng-template #no_today_top_recipes><p class="nodata" i18n>Keine Daten vorhanden</p></ng-template>
            </mat-card-content>
        </mat-card>
    </div>

</div>
